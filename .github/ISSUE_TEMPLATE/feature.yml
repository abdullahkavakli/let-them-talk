name: Feature request
description: Something you would like the app to do
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could look (optional)
      description: Any idea, sketch or example.
